name: KiCad 9 Auto-Render

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.kicad_sch'
      - '**/*.kicad_pcb'
      - '**/*.kicad_pro'
  workflow_dispatch:

jobs:
  render:
    name: Generate SVG Renders
    runs-on: ubuntu-latest
    container:
      # Updated to KiCad 9 official image
      image: ghcr.io/kicad/kicad:9.0
      options: --user root
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Renders
        run: |
          # 1. Get the absolute path for the output folder
          RENDER_ROOT="$(pwd)/renders_output"
          mkdir -p "$RENDER_ROOT"
          
          # Save the starting directory (the repo root)
          REPO_ROOT="$(pwd)"

          # 2. Render Schematics
          find . -name "*.kicad_sch" | while read -r sch_file; do
            rel_dir=$(dirname "$sch_file")
            base_name=$(basename "$sch_file" .kicad_sch)
            
            mkdir -p "$RENDER_ROOT/$rel_dir"
            
            echo "Processing Schematic: $sch_file"
            
            # Use standard 'cd' to enter the folder
            cd "$REPO_ROOT/$rel_dir"
            kicad-cli sch export svg --output "$RENDER_ROOT/$rel_dir/${base_name}_sch.svg" "$(basename "$sch_file")"
            
            # Return to repo root
            cd "$REPO_ROOT"
          done

          # 3. Render PCBs (Front and Back)
          find . -name "*.kicad_pcb" | while read -r pcb_file; do
            rel_dir=$(dirname "$pcb_file")
            base_name=$(basename "$pcb_file" .kicad_pcb)
            
            mkdir -p "$RENDER_ROOT/$rel_dir"
            
            echo "Processing PCB: $pcb_file"
            cd "$REPO_ROOT/$rel_dir"
            
            # Export Front Side
            kicad-cli pcb export svg --layers "F.Cu,F.Mask,F.Silkscreen,Edge.Cuts" --output "$RENDER_ROOT/$rel_dir/${base_name}_pcb_front.svg" "$(basename "$pcb_file")"
            
            # Export Back Side (Mirrored is often better for the back)
            kicad-cli pcb export svg --layers "B.Cu,B.Mask,B.Silkscreen,Edge.Cuts" --mirror --output "$RENDER_ROOT/$rel_dir/${base_name}_pcb_back.svg" "$(basename "$pcb_file")"
            
            cd "$REPO_ROOT"
          done

      - name: Upload Renders as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kicad-renders
          path: renders_output

  publish:
    name: Publish to 'renders' Branch
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Renders
        uses: actions/download-artifact@v4
        with:
          name: kicad-renders
          path: renders

      - name: Push to 'renders' branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: renders
          publish_dir: ./renders
          force_orphan: true
          commit_message: "Auto-generated KiCad 9 renders [skip ci]"
